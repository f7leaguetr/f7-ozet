name: F7 mac ozetleri

on:
  schedule:
    - cron: "*/15 * * * *"   # 15 dakikada bir yeni link var mi bakar
  workflow_dispatch:          # GitHub'da "Run workflow" ile elle de calisir
    inputs:
      match_keys:
        description: "Sadece bu maclari isle (virgulle, bos = sirayla)"
        required: false
        default: ""

concurrency:
  group: ozet
  cancel-in-progress: false

jobs:
  ozet:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3, 4]   # 4 mac ayni anda islenir
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      OZET_WORKER_TOKEN: ${{ secrets.OZET_WORKER_TOKEN }}
    steps:
      - name: Bekleyen mac var mi?
        id: check
        run: |
          n=$(curl -fsS -X POST "$SUPABASE_URL/functions/v1/highlight-worker" \
               -H "x-worker-token: $OZET_WORKER_TOKEN" -H "Content-Type: application/json" \
               -d '{"action":"pending","limit":1}' | grep -c match_key || true)
          echo "pending=$n" >> "$GITHUB_OUTPUT"
          echo "Bekleyen: $n"

      - uses: actions/checkout@v4
        if: steps.check.outputs.pending != '0'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.pending != '0'
        with:
          python-version: "3.12"

      - uses: denoland/setup-deno@v2
        if: steps.check.outputs.pending != '0'
        with:
          deno-version: v2.x

      - uses: FedericoCarboni/setup-ffmpeg@v3
        if: steps.check.outputs.pending != '0'
        with:
          github-token: ${{ github.token }}

      - name: Araclar
        if: steps.check.outputs.pending != '0'
        timeout-minutes: 10
        run: |
          pip install -q -r requirements.txt
          ffmpeg -version | head -1
          deno --version | head -1
          yt-dlp --version
          curl -fsSL -o assets/Oswald-Bold.ttf \
            "https://github.com/googlefonts/OswaldFont/raw/main/fonts/ttf/Oswald-Bold.ttf" || true

      - name: Ozetleri uret
        if: steps.check.outputs.pending != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
          OZET_ONLY: ${{ github.event.inputs.match_keys }}
        run: python -m ozet.main
